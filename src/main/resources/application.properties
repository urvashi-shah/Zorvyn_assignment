spring.application.name=taskmanager

# MongoDB connection — set MONGODB_URI in your environment (never commit credentials).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskmanager}

# JWT settings — set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtZG9ub3QtdXNlLWluLXByb2QtdGhpcy1tdXN0LWJlLXZlcnktbG9uZy0xMjM0NTY3ODkw}
app.jwt.expiration-ms=86400000

# OpenAI — set OPENAI_API_KEY in your environment (never commit keys).
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=https://api.openai.com
app.openai.model=gpt-4o-mini
app.openai.timeout-seconds=30
